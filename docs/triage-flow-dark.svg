<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="870" viewBox="0 0 680 870" role="img">
<title>How the triage-ticket skill runs an alert end to end</title>
<desc>Vertical flow in four phases. Intake pulls the Jira ticket, checks the prior record in Confluence and confirms terminal access. A gate checks whether the Sentinel incident is already closed, which stops the run early. Investigation identifies the detecting product, runs KQL from the cookbook for that alert family and rates severity. Exactly one of four dispositions is reached: true positive, false positive, benign positive, or awaiting customer confirmation. The record phase writes the Jira comment and transition, closes the Sentinel incident and writes the incident record. Containment happens only after the analyst replies over iMessage. Every run ends with teardown.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600}.ts{font-size:12px;font-weight:400}rect{stroke-width:1}.bd{fill:none;stroke:#5F5E5A;stroke-width:1;stroke-dasharray:4 4}.bl{font-size:12px;font-weight:400;fill:#B4B2A9}.arr{fill:none;stroke:#B4B2A9;stroke-width:1.5}.r-gray>rect{fill:#444441;stroke:#B4B2A9}.r-gray>.th{fill:#D3D1C7}.r-gray>.ts{fill:#B4B2A9}.r-purple>rect{fill:#3C3489;stroke:#AFA9EC}.r-purple>.th{fill:#CECBF6}.r-purple>.ts{fill:#AFA9EC}.r-teal>rect{fill:#085041;stroke:#5DCAA5}.r-teal>.th{fill:#9FE1CB}.r-teal>.ts{fill:#5DCAA5}.r-coral>rect{fill:#712B13;stroke:#F0997B}.r-coral>.th{fill:#F5C4B3}.r-coral>.ts{fill:#F0997B}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bd" x="40" y="96" width="600" height="100" rx="8"/>
<text class="bl" x="52" y="113">intake</text>
<rect class="bd" x="40" y="292" width="600" height="100" rx="8"/>
<text class="bl" x="52" y="309">investigate</text>
<rect class="bd" x="40" y="414" width="600" height="166" rx="8"/>
<text class="bl" x="52" y="431">decide: exactly one</text>
<rect class="bd" x="40" y="602" width="600" height="100" rx="8"/>
<text class="bl" x="52" y="619">record</text>
<line class="arr" x1="340" y1="72" x2="340" y2="94" marker-end="url(#arrow)"/>
<line class="arr" x1="225" y1="150" x2="253" y2="150" marker-end="url(#arrow)"/>
<line class="arr" x1="425" y1="150" x2="453" y2="150" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="196" x2="340" y2="216" marker-end="url(#arrow)"/>
<line class="arr" x1="345" y1="244" x2="383" y2="244" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="270" x2="200" y2="290" marker-end="url(#arrow)"/>
<line class="arr" x1="225" y1="346" x2="253" y2="346" marker-end="url(#arrow)"/>
<line class="arr" x1="425" y1="346" x2="453" y2="346" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="392" x2="340" y2="412" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="580" x2="340" y2="600" marker-end="url(#arrow)"/>
<line class="arr" x1="225" y1="656" x2="253" y2="656" marker-end="url(#arrow)"/>
<line class="arr" x1="425" y1="656" x2="453" y2="656" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="702" x2="340" y2="722" marker-end="url(#arrow)"/>
<line class="arr" x1="345" y1="750" x2="365" y2="750" marker-end="url(#arrow)"/>
<line class="arr" x1="496" y1="776" x2="496" y2="796" marker-end="url(#arrow)"/>
<g class="r-gray"><rect x="204" y="20" width="272" height="52" rx="4"/><text class="th" x="340" y="41" text-anchor="middle">Alert ticket in</text><text class="ts" x="340" y="58" text-anchor="middle">Sentinel alert, via Jira</text></g>
<g class="r-purple"><rect x="55" y="124" width="170" height="52" rx="4"/><text class="th" x="140" y="145" text-anchor="middle">Pull the ticket</text><text class="ts" x="140" y="162" text-anchor="middle">Jira MCP</text></g>
<g class="r-purple"><rect x="255" y="124" width="170" height="52" rx="4"/><text class="th" x="340" y="145" text-anchor="middle">Check prior record</text><text class="ts" x="340" y="162" text-anchor="middle">Confluence IIRR</text></g>
<g class="r-purple"><rect x="455" y="124" width="170" height="52" rx="4"/><text class="th" x="540" y="145" text-anchor="middle">Confirm access</text><text class="ts" x="540" y="162" text-anchor="middle">terminal sign-in</text></g>
<g class="r-gray"><rect x="55" y="218" width="290" height="52" rx="4"/><text class="th" x="200" y="239" text-anchor="middle">Is the incident still open?</text><text class="ts" x="200" y="256" text-anchor="middle">checked before any KQL runs</text></g>
<g class="r-gray"><rect x="385" y="218" width="240" height="52" rx="4"/><text class="th" x="505" y="239" text-anchor="middle">Closed: stop here</text><text class="ts" x="505" y="256" text-anchor="middle">comment, resolve, close</text></g>
<g class="r-teal"><rect x="55" y="320" width="170" height="52" rx="4"/><text class="th" x="140" y="341" text-anchor="middle">Detecting product</text><text class="ts" x="140" y="358" text-anchor="middle">from the alert</text></g>
<g class="r-teal"><rect x="255" y="320" width="170" height="52" rx="4"/><text class="th" x="340" y="341" text-anchor="middle">Investigate in KQL</text><text class="ts" x="340" y="358" text-anchor="middle">cookbook per family</text></g>
<g class="r-teal"><rect x="455" y="320" width="170" height="52" rx="4"/><text class="th" x="540" y="341" text-anchor="middle">Rate severity</text><text class="ts" x="540" y="358" text-anchor="middle">impact and scope</text></g>
<g class="r-coral"><rect x="55" y="442" width="272" height="52" rx="4"/><text class="th" x="191" y="463" text-anchor="middle">True positive</text><text class="ts" x="191" y="480" text-anchor="middle">escalate, then contain on approval</text></g>
<g class="r-coral"><rect x="353" y="442" width="272" height="52" rx="4"/><text class="th" x="489" y="463" text-anchor="middle">False positive</text><text class="ts" x="489" y="480" text-anchor="middle">close, recommend tuning</text></g>
<g class="r-coral"><rect x="55" y="508" width="272" height="52" rx="4"/><text class="th" x="191" y="529" text-anchor="middle">Benign positive</text><text class="ts" x="191" y="546" text-anchor="middle">close, document what authorized it</text></g>
<g class="r-coral"><rect x="353" y="508" width="272" height="52" rx="4"/><text class="th" x="489" y="529" text-anchor="middle">Awaiting confirmation</text><text class="ts" x="489" y="546" text-anchor="middle">keep the ticket in progress</text></g>
<g class="r-coral"><rect x="55" y="630" width="170" height="52" rx="4"/><text class="th" x="140" y="651" text-anchor="middle">Jira record</text><text class="ts" x="140" y="668" text-anchor="middle">comment + transition</text></g>
<g class="r-coral"><rect x="255" y="630" width="170" height="52" rx="4"/><text class="th" x="340" y="651" text-anchor="middle">Sentinel close</text><text class="ts" x="340" y="668" text-anchor="middle">classify and close</text></g>
<g class="r-coral"><rect x="455" y="630" width="170" height="52" rx="4"/><text class="th" x="540" y="651" text-anchor="middle">IIRR record</text><text class="ts" x="540" y="668" text-anchor="middle">per detection type</text></g>
<g class="r-gray"><rect x="55" y="724" width="290" height="52" rx="4"/><text class="th" x="200" y="745" text-anchor="middle">Arm the Inkbox bridge</text><text class="ts" x="200" y="762" text-anchor="middle">true positive or approval</text></g>
<g class="r-gray"><rect x="367" y="724" width="258" height="52" rx="4"/><text class="th" x="496" y="745" text-anchor="middle">Contain only on reply</text><text class="ts" x="496" y="762" text-anchor="middle">never without the analyst</text></g>
<g class="r-gray"><rect x="55" y="798" width="570" height="52" rx="4"/><text class="th" x="340" y="819" text-anchor="middle">Teardown</text><text class="ts" x="340" y="836" text-anchor="middle">end iMessage, release the lock, stop the bridge if it was armed</text></g>
</svg>